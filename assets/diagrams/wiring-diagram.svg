<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Mantis-Blades wiring diagram</title>
  <desc id="desc">Arduino Uno connected to two servos and one MPU-6050 over I2C with external 5V servo power and shared ground.</desc>
  <style>
    .bg { fill: #f7f7f5; }
    .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
    .uno { fill: #0b5ea8; stroke: #0f172a; stroke-width: 3; rx: 24; ry: 24; }
    .chip { fill: #1f2937; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
    .header { fill: #111827; rx: 6; ry: 6; }
    .servo { fill: #3f3f46; stroke: #18181b; stroke-width: 3; rx: 18; ry: 18; }
    .module { fill: #1d4f91; stroke: #0f172a; stroke-width: 3; rx: 20; ry: 20; }
    .power { fill: #ffffff; stroke: #111827; stroke-width: 3; rx: 18; ry: 18; }
    .title { font: 700 34px Arial, sans-serif; fill: #111827; }
    .label { font: 700 20px Arial, sans-serif; fill: #111827; }
    .small { font: 600 16px Arial, sans-serif; fill: #111827; }
    .tiny { font: 600 13px Arial, sans-serif; fill: #111827; }
    .mini { font: 600 12px Arial, sans-serif; fill: #111827; }
    .white { fill: #ffffff; }
    .red { stroke: #dc2626; }
    .black { stroke: #111827; }
    .yellow { stroke: #eab308; }
    .blue { stroke: #2563eb; }
    .green { stroke: #16a34a; }
    .wire { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .dot-red { fill: #dc2626; }
    .dot-black { fill: #111827; }
    .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; }
  </style>

  <rect class="bg" x="0" y="0" width="1400" height="900" />
  <text class="title" x="700" y="60" text-anchor="middle">Mantis-Blades Wiring Diagram</text>

  <rect class="servo" x="80" y="290" width="180" height="170" />
  <rect class="servo" x="1140" y="290" width="180" height="170" />
  <rect x="118" y="260" width="104" height="42" rx="18" ry="18" fill="#a1a1aa" stroke="#18181b" stroke-width="3" />
  <rect x="1178" y="260" width="104" height="42" rx="18" ry="18" fill="#a1a1aa" stroke="#18181b" stroke-width="3" />
  <text class="label" x="170" y="245" text-anchor="middle">Servo A</text>
  <text class="label" x="1230" y="245" text-anchor="middle">Servo B</text>
  <text class="tiny" x="170" y="485" text-anchor="middle">Yellow = signal</text>
  <text class="tiny" x="170" y="502" text-anchor="middle">Red = 5V, Black = GND</text>
  <text class="tiny" x="1230" y="485" text-anchor="middle">Yellow = signal</text>
  <text class="tiny" x="1230" y="502" text-anchor="middle">Red = 5V, Black = GND</text>

  <rect class="uno" x="400" y="160" width="600" height="460" />
  <rect class="chip" x="610" y="395" width="260" height="80" />
  <rect class="header" x="460" y="190" width="460" height="26" />
  <rect class="header" x="460" y="560" width="320" height="26" />
  <rect class="header" x="805" y="560" width="130" height="26" />
  <rect class="header" x="932" y="355" width="26" height="88" />
  <text class="title white" x="700" y="330" text-anchor="middle" font-size="30">Arduino Uno</text>
  <text class="small white" x="690" y="242" text-anchor="middle">Top digital header</text>
  <text class="small white" x="620" y="542" text-anchor="middle">Power header</text>
  <text class="small white" x="870" y="542" text-anchor="middle">Analog in</text>

  <circle cx="946" cy="371" r="6" fill="#eab308" />
  <circle cx="946" cy="411" r="6" fill="#eab308" />
  <text class="small white" x="970" y="377">D9</text>
  <text class="small white" x="970" y="417">D10</text>

  <circle cx="650" cy="574" r="6" fill="#dc2626" />
  <circle cx="720" cy="574" r="6" fill="#111827" />
  <text class="small white" x="625" y="610">5V</text>
  <text class="small white" x="692" y="610">GND</text>

  <circle cx="865" cy="574" r="6" fill="#2563eb" />
  <circle cx="905" cy="574" r="6" fill="#16a34a" />
  <text class="mini white" x="823" y="607">A4</text>
  <text class="mini white" x="849" y="607">SDA</text>
  <text class="mini white" x="883" y="607">A5</text>
  <text class="mini white" x="909" y="607">SCL</text>

  <rect class="module" x="1060" y="90" width="240" height="150" />
  <text class="label white" x="1180" y="125" text-anchor="middle">MPU-6050</text>
  <circle cx="1088" cy="150" r="7" fill="#dc2626" />
  <circle cx="1088" cy="180" r="7" fill="#111827" />
  <circle cx="1088" cy="210" r="7" fill="#2563eb" />
  <circle cx="1088" cy="240" r="7" fill="#16a34a" />
  <text class="small white" x="1110" y="156">VCC</text>
  <text class="small white" x="1110" y="186">GND</text>
  <text class="small white" x="1110" y="216">SDA</text>
  <text class="small white" x="1110" y="246">SCL</text>

  <rect class="power" x="70" y="650" width="220" height="140" />
  <text class="label" x="180" y="695" text-anchor="middle">External 5V</text>
  <text class="label" x="180" y="725" text-anchor="middle">Servo Power</text>
  <text class="title" x="246" y="718" font-size="26">+</text>
  <text class="title" x="246" y="770" font-size="26">-</text>

  <path class="wire yellow" d="M260 340 H330 V371 H946" />
  <path class="wire yellow" d="M1140 340 H1040 V411 H946" />
  <text class="small" x="350" y="322">Servo A signal</text>
  <text class="small" x="350" y="342">to D9</text>
  <text class="small" x="995" y="448">Servo B signal</text>
  <text class="small" x="995" y="468">to D10</text>

  <path class="wire red" d="M260 395 V730 H290" />
  <path class="wire red" d="M1140 395 V730 H290" />
  <path class="wire red" d="M290 730 H650 V574" />
  <text class="small" x="360" y="690">Servo 5V rail</text>

  <path class="wire black" d="M260 425 V780 H290" />
  <path class="wire black" d="M1140 425 V780 H290" />
  <path class="wire black" d="M290 780 H720 V574" />
  <text class="small" x="430" y="818">Shared ground rail</text>

  <path class="wire red" d="M1088 150 H1000 V130 H650 V574" />
  <path class="wire black" d="M1088 180 H1015 V165 H720 V574" />
  <path class="wire blue" d="M1088 210 H1030 V220 H865 V574" />
  <path class="wire green" d="M1088 240 H1045 V275 H905 V574" />

  <circle class="dot-red" cx="290" cy="730" r="7" />
  <circle class="dot-red" cx="650" cy="574" r="7" />
  <circle class="dot-black" cx="290" cy="780" r="7" />
  <circle class="dot-black" cx="720" cy="574" r="7" />

  <rect class="note" x="460" y="670" width="390" height="90" />
  <text class="label" x="655" y="705" text-anchor="middle">Common Ground Required</text>
  <text class="small" x="655" y="733" text-anchor="middle">Tie Arduino GND and external</text>
  <text class="small" x="655" y="753" text-anchor="middle">servo supply GND together.</text>

  <rect class="panel" x="1030" y="650" width="270" height="155" />
  <text class="label" x="1165" y="690" text-anchor="middle">Pin Summary</text>
  <text class="small" x="1055" y="720">Servo A signal -> D9</text>
  <text class="small" x="1055" y="745">Servo B signal -> D10</text>
  <text class="small" x="1055" y="770">MPU-6050 SDA -> A4</text>
  <text class="small" x="1055" y="795">MPU-6050 SCL -> A5</text>
</svg>
